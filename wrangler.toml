name = "heyranks"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# D1 database — create with:
#   wrangler d1 create heyranks-prod
# then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "heyranks-prod"
database_id = "97003260-65b8-437c-8af7-7bab3d3f6f76"

# Tables are created / migrated automatically on the first request (lib/schema.js).
# Env vars — set secrets via `wrangler pages secret put <NAME>` (full list in README.md):
#   RESEND_API_KEY, ADMIN_EMAILS, SITE_URL, ADMIN_SECRET
#   PAYMENT_LINK_180DAY, PAYMENT_LINK_LIFETIME           (optional — upgrade buttons)
#   STRIPE_SECRET | RAZORPAY_SECRET | LEMONSQUEEZY_SECRET (webhook signing secrets)
#   PSI_KEY, CURRENCY                                     (optional)
