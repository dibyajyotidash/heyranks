name = "heyranks"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# D1 database — create with:
#   wrangler d1 create heyranks-prod
# then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "heyranks-prod"
database_id = "97003260-65b8-437c-8af7-7bab3d3f6f76"

# Env vars — set secrets via:
#   wrangler pages secret put RESEND_API_KEY
#   wrangler pages secret put ADMIN_SECRET
#   wrangler pages secret put PSI_KEY          (optional — Google PageSpeed)
#   wrangler pages secret put STRIPE_SECRET    (optional — Stripe webhooks)
#   wrangler pages secret put RAZORPAY_SECRET  (optional — Razorpay webhooks)
