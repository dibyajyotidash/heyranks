<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — HeyRanks</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f1720'/%3E%3Cpath d='M4 18 L9 12 L13 15 L20 6' stroke='%23d9f99d' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js"></script>
</head>
<body>
<main class="auth-main" style="min-height:100vh">
  <div class="auth-box">
    <a href="/" class="logo" style="color:var(--ink);margin-bottom:28px"><span class="logo-mark" style="background:var(--brand-dark)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 18 L9 12 L13 15 L20 6" stroke="#d9f99d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>HeyRanks</a>

    <section id="request">
      <h1>Forgot your password?</h1>
      <p class="sub">Enter your email and we'll send you a link to choose a new one.</p>
      <div id="msg1" role="alert"></div>
      <form id="request-form">
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
        <button class="btn primary block">Send reset link</button>
      </form>
    </section>

    <section id="choose" class="hidden">
      <h1>Choose a new password</h1>
      <p class="sub">This also logs you out on your other devices.</p>
      <div id="msg2" role="alert"></div>
      <form id="choose-form">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" required>
          <div class="hint">At least 8 characters.</div>
        </div>
        <button class="btn primary block">Save and log in</button>
      </form>
    </section>

    <p class="auth-foot"><a href="/login">Back to log in</a></p>
  </div>
</main>
<script>
const { api, esc } = HR;
const token = new URLSearchParams(location.search).get("token");
const show = (id, text, kind = "error") => { document.getElementById(id).innerHTML = `<div class="alert ${kind}">${esc(text)}</div>`; };

if (token) {
  document.getElementById("request").classList.add("hidden");
  document.getElementById("choose").classList.remove("hidden");
  history.replaceState(null, "", location.pathname);
}

document.getElementById("request-form").addEventListener("submit", async e => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  try {
    await api("auth/forgot", { method: "POST", body: { email } });
    show("msg1", `If ${email} has an account, a reset link is on its way. It expires in 1 hour.`, "ok");
  } catch (err) { show("msg1", err.message); }
});

document.getElementById("choose-form").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    await api("auth/reset", { method: "POST", body: { token, password: document.getElementById("password").value } });
    location.replace("/dashboard");
  } catch (err) { show("msg2", err.message); }
});
</script>
<script src="/assets/track.js" defer></script>
</body>
</html>
